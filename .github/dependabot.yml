version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      aspnetcore:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.Extensions.*"]
      testing:
        patterns: ["xunit*", "Testcontainers*"]
    ignore:
      # Stay on .NET 10 (LTS); framework-versioned packages move with the target framework, not with Dependabot.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      # Angular packages must be upgraded together (major upgrades go through `ng update`).
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]
      lint-and-format:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "prettier"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss"]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      # The supported TypeScript range is set by Angular; bump it as part of an Angular upgrade.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
