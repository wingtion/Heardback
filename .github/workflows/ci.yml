name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore JobTrail.slnx

      - name: Check formatting
        run: dotnet format JobTrail.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build JobTrail.slnx --configuration Release --no-restore

      # Integration tests start a real Postgres via Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test --solution JobTrail.slnx --configuration Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Use the npm version pinned in package.json so lockfile handling and install-script policy match local dev.
      - name: Install pinned npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
